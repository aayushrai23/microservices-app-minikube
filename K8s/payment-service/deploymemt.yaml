apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-deployment
  namespace: services
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: payment-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: payment-config    # Loads PORT, AUTH_SERVICE_URL, NOTIFICATION_SERVICE_URL
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: payment-secret
                  key: MONGO_URI
